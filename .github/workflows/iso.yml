# Builds the installable LUMEN OS live ISO and publishes it as a GitHub
# (pre-)release: dev container → RPMs (scripts/build-rpms.sh) → kiwi ISO
# (iso/build-iso.sh). The ISO (~1.3 GB) and SHA256SUMS are attached to the
# release; GitHub allows release assets up to 2 GB.
name: ISO

on:
  workflow_dispatch:
    inputs:
      boot_test:
        description: 'Boot the ISO in QEMU after building (adds ~10–30 min)'
        type: boolean
        default: false
  push:
    tags: ['v*']
    branches: [main, 'claude/**']
    paths-ignore: ['docs/**', '**.md']

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - name: Free disk space (kiwi peaks at ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v5

      - name: Build the Fedora 45 dev container
        run: docker build -t lumen-dev:45 -f scripts/devcontainer/Containerfile scripts/devcontainer

      - name: Visual QA scenes (headless Mesa, inside the dev container)
        run: |
          mkdir -p out/visual
          scripts/dev.sh scripts/build.sh --no-tests
          for s in controls-gallery glass-materials liquid-glass icon-grid; do
            scripts/dev.sh scripts/xrun.sh ./build/lumen-qmlgrab tests/visual/$s.qml out/visual/$s.png --size 1440x900
          done

      - name: Upload visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: out/visual/*.png
          if-no-files-found: warn

      - name: Build RPMs (with tests in %check)
        run: scripts/build-rpms.sh

      - name: Build the ISO
        # out/ is root-owned after the containerised RPM build.
        run: sudo --preserve-env=CONTAINER_RUNTIME iso/build-iso.sh

      - name: Collect
        id: iso
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          cd out/iso
          ls -la
          iso=$(ls *.iso | head -1)
          echo "file=out/iso/$iso" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Boot smoke test (QEMU, KVM when available)
        # Optional (workflow_dispatch only): boots the fresh ISO, waits for the
        # live session and fails if it never starts. Screenshots, the journal
        # and the guest diagnostics land in out/glass-test/.
        if: inputs.boot_test
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          scripts/qemu-glass-test.sh "${{ steps.iso.outputs.file }}" 10
          grep -q "lumen-shell" out/glass-test/journal.log

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            tag="build-${{ github.run_number }}-${{ steps.iso.outputs.short }}"
          fi
          notes="LUMEN OS live + installer ISO built from ${GITHUB_SHA}.

          Write it to a USB stick (Fedora Media Writer, balenaEtcher or \`dd\`) and boot it on a UEFI PC, or boot it in a VM with UEFI firmware enabled.
          In the live session start the installer (Calamares) from the first icon in the Dock to install it to disk.
          Check the download with \`sha256sum -c SHA256SUMS\`."
          flags="--prerelease"
          [ "${GITHUB_REF_TYPE}" = "tag" ] && flags=""
          assets="${{ steps.iso.outputs.file }}"
          # Release assets must be < 2 GiB: split larger images.
          if [ "$(stat -c %s "$assets")" -ge 2100000000 ]; then
            split -b 1900M -d "$assets" "$assets.part"
            assets=$(ls "$assets".part*)
            notes="$notes

          The ISO is split into parts (GitHub's 2 GiB file limit). Join them first:
          \`cat $(basename "${{ steps.iso.outputs.file }}").part* > $(basename "${{ steps.iso.outputs.file }}")\`"
          fi
          gh release create "$tag" $assets out/iso/SHA256SUMS \
            --target "${GITHUB_SHA}" --title "LUMEN OS 1.0 (${tag})" --notes "$notes" $flags
