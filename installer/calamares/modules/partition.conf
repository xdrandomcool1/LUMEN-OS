---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 600M
efiSystemPartitionName: EFI
userSwapChoices: [ none, small, file ]
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
# Filesystem selection: Btrfs (default, with subvolumes), ext4 or XFS.
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /root
  - mountPoint: /home
    subvolume: /home
  - mountPoint: /var/log
    subvolume: /var/log
# Full-disk encryption (LUKS2) is offered on the partitioning page.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
initialPartitioningChoice: none
