---
# Remove live-session-only bits from the installed system.
dontChroot: false
timeout: 300
script:
  - "-userdel -r liveuser"
  - "-rm -f /etc/sddm.conf.d/live-autologin.conf"
  - "-dnf -y remove calamares lumen-installer"
  - "-rm -f /etc/sudoers.d/liveuser"
  - "systemctl set-default graphical.target"
