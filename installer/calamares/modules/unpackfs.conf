---
# The installed system is a copy of the live root image. dracut's
# dmsquash-live exposes that read-only image in one of two ways, depending on
# the live overlay mode, so both are listed and the one that exists is used
# (unpackfs skips missing optional sources):
#  - device-mapper snapshot (the LUMEN ISO default, kernel args
#    "root=live:CDLABEL=… rd.live.image"): /dev/mapper/live-base (ext4)
#  - OverlayFS (rd.live.overlay.overlayfs=1): mounted at /run/rootfsbase
# Verified in QEMU with scripts/qemu-glass-test.sh (diag.txt).
unpack:
  - source: "/dev/mapper/live-base"
    sourcefs: "ext4"
    destination: ""
    optional: true
  - source: "/run/rootfsbase"
    sourcefs: "file"
    destination: ""
    optional: true
