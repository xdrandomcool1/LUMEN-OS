---
defaultGroups: [ users, wheel, lp, video, audio, network, storage ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true
passwordRequirements:
  minLength: 4
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, liveuser ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "lumen-${cpu}"
