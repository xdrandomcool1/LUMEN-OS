# LUMEN OS — Calamares configuration (/etc/calamares/settings.conf)
---
modules-search: [ local, /usr/lib64/calamares/modules ]

instances:
- id: lumen
  module: shellprocess
  config: shellprocess-lumen.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - dracutlukscfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@lumen
  - dracut
  - bootloader
  - umount
- show:
  - finished

branding: lumen
# Nothing is written to disk before the user confirms the summary page.
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
